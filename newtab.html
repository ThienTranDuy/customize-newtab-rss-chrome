<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSS Reader</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bookmarks-container">
        <div class="bookmarks-bar"></div>
    </div>

    <div class="container">
        <header>
            <h1>RSS Reader</h1>
            <button id="manageFeedsBtn" class="manage-feeds-btn">Manage Feeds</button>
        </header>

        <div id="rssManager" class="rss-manager" style="display: none;">
            <div class="rss-input-group">
                <input type="text" id="rssUrl" placeholder="Enter RSS URL">
                <input type="text" id="rssName" placeholder="Feed Name (optional)">
                <input type="text" id="rssCode" placeholder="Feed Code (optional)">
                <input type="number" id="rssLimit" placeholder="Post Limit" min="1" max="100" value="20">
                <button id="saveUrl">Add Feed</button>
            </div>
            <div class="rss-feeds-list">
                <h3>Your Feeds</h3>
                <div id="rssFeeds"></div>
            </div>
        </div>

        <div id="loading">Loading...</div>
        <div class="error" style="display: none;"></div>
        
        <div class="articles-container">
            <div class="articles-grid pinned-articles"></div>
            <div class="articles-grid normal-articles"></div>
        </div>
        
        <div id="loadMore" class="load-more" style="display: none;">
            <div class="loading-spinner"></div>
            <span>Loading more...</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
